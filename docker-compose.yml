services:
  db:
    image: postgres:16
    container_name: thinkback-db
    environment:
      POSTGRES_USER: thinkback
      POSTGRES_PASSWORD: thinkback
      POSTGRES_DB: thinkback
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thinkback -d thinkback"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
